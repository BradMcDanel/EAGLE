# All datasets validation sweep
# Tests all available datasets with a small set of proven configurations
# to ensure everything works across different benchmarks

model:
  base_path: "allenai/OLMoE-1B-7B-0125-Instruct"
  eagle_path: "wantsleep/OLMoE_1B_7B_Eagle3"
  gpus_per_run: 1

# Test all available datasets
datasets: [mt_bench, gsm8k, humaneval, alpaca, qa, sum]

# Single temperature for quick validation
temperatures: [0.0]

# Single draft token setting
draft_tokens: [63]

# Test both pruning strategies
pruning_strategies: [substitution, truncation]

# Minimal set of proven configurations
expert_selection:
  cardinality: [16]  # Best performing from previous tests
  probability: [0.60]  # Good balance of speed and accuracy

# Options
num_samples: 5  # Only run 5 samples per dataset for quick validation
overwrite: false  # Skip existing runs by default
